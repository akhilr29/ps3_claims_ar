name: ps3
channels:
  - conda-forge
  - nodefaults
dependencies:
  # defaults
  - python>=3.8
  - pip
  - pre-commit
  - pytest>=6  # Adds --import-mode option
  - pytest-cov
  - setuptools-scm
  # data
  - pandas
  - numpy
  - dask-ml
  - ydata-profiling
  # interactive
  - ipykernel
  - nbformat  # needed to render plotly figures (e.g. dalex plots) in notebooks
  # plots
  - matplotlib
  # ml
  - glum
  - lightgbm
  - optuna
  - scikit-learn
  # explainability
  - pip:
      # >=1.8.0: older versions use ndarray.ptp(), which NumPy 2 removed
      - dalex>=1.8.0
